name: Connector — Windows install

# The Windows half of the connector cannot be rehearsed on a Mac. install.ps1,
# the firewall rule and the scheduled task only exist once they are on Windows,
# so without this the first time they ever run is in a hospital's laboratory.
#
# A free GitHub-hosted Windows runner does the whole thing: build the
# executable, install it, pair it, let a fake analyzer connect over TCP, and
# confirm the result reached the server.
#
# A step's background processes do not survive into the next step, so every
# step that needs the mock server starts it itself; the mock reloads what it
# recorded so restarting loses nothing.
#
# It talks to a mock server inside the job, never to production. Pointing CI at
# the real one would mean a live pairing code in a repository secret and test
# rows appearing in a hospital's account.

on:
  push:
    paths:
      - 'connector/**'
      - '.github/workflows/connector-windows.yml'
  pull_request:
    paths:
      - 'connector/**'
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    # Windows minutes bill at 2x on a private repo; this finishes in ~4.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: connector
        run: npm ci

      - name: Unit tests — the ASTM link layer
        working-directory: connector
        run: npm test

      - name: Build the Windows executable
        working-directory: connector
        run: node build.mjs --win

      - name: Run install.ps1 the way a hospital would
        working-directory: connector/dist-exe
        shell: pwsh
        run: |
          ..\test\start-mock.ps1
          .\install.ps1 -Code 'CITE-ST01' -Server 'http://127.0.0.1:8787'
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }

      - name: The install did what it claims
        shell: pwsh
        run: |
          $fail = @()

          $exe = "$env:ProgramFiles\Uyirly\Connector\uyirly-connector.exe"
          if (-not (Test-Path $exe)) { $fail += 'executable was not copied into Program Files' }

          # Paired, and the mock recorded it.
          $rec = Get-Content connector\received.json -Raw | ConvertFrom-Json
          if (-not $rec.paired)               { $fail += 'the installer never paired' }
          if ($rec.paired.code -ne 'CITE-ST01') { $fail += "wrong pairing code sent: $($rec.paired.code)" }
          if (-not $rec.paired.machineName)   { $fail += 'no machine name was reported' }

          # netsh and schtasks return an ARRAY of lines, and -match on an array
          # filters it rather than testing it — so "-notmatch" is truthy whenever
          # any single line fails to match, which is always. Join first.
          # This is why the run claimed the firewall was off while the
          # connector's own --check, three seconds earlier, said it was on.

          # Starts with Windows, and is running now.
          $task = (schtasks /Query /TN 'UyirlyLabConnector' /FO LIST 2>$null) -join "`n"
          if ($LASTEXITCODE -ne 0) { $fail += 'the startup task was not created' }
          elseif ($task -notmatch 'Running') {
            # A task that has just been told to run may still be starting.
            foreach ($i in 1..20) {
              Start-Sleep -Milliseconds 500
              $task = (schtasks /Query /TN 'UyirlyLabConnector' /FO LIST 2>$null) -join "`n"
              if ($task -match 'Running') { break }
            }
            if ($task -notmatch 'Running') {
              Write-Host "--- schtasks says ---`n$task"
              $fail += 'the startup task exists but never started running'
            }
          }

          # Analyzers can reach us.
          $fw = (netsh advfirewall firewall show rule name="Uyirly Lab Connector" 2>$null) -join "`n"
          if ($LASTEXITCODE -ne 0) { $fail += 'the firewall rule was not created' }
          elseif ($fw -notmatch 'Enabled:\s*Yes') {
            Write-Host "--- netsh says ---`n$fw"
            $fail += 'the firewall rule is switched off'
          }

          if ($fail.Count) { $fail | ForEach-Object { Write-Host "FAIL: $_" }; exit 1 }
          Write-Host 'install verified'
          exit 0   # same reason: native commands above leave $LASTEXITCODE set

      - name: An analyzer connects and its result arrives
        working-directory: connector
        shell: pwsh
        run: |
          .\test\start-mock.ps1
          # The scheduled task starts the connector; give it a moment to bind.
          $listening = $false
          foreach ($i in 1..40) {
            if (Test-NetConnection -ComputerName 127.0.0.1 -Port 5150 -InformationLevel Quiet -WarningAction SilentlyContinue) {
              $listening = $true; break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $listening) { throw 'nothing is listening on 5150 — the service did not start' }

          node test/fake-analyzer.mjs 127.0.0.1 5150 260923000101 13.4
          if ($LASTEXITCODE -ne 0) { throw 'the fake analyzer could not deliver' }

          # It has to travel: analyzer -> connector -> disk -> mock server.
          $got = $null
          foreach ($i in 1..40) {
            $rec = Get-Content received.json -Raw | ConvertFrom-Json
            if ($rec.messages.Count -ge 1) { $got = $rec.messages[0]; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $got) { throw 'the result never reached the server' }

          # The records must arrive intact and separated, not fused into one
          # line — the bug an end-to-end run caught once already.
          if ($got.raw -notmatch 'BC-5130')      { throw 'the instrument header was lost' }
          if ($got.raw -notmatch '260923000101') { throw 'the sample barcode was lost' }
          if ($got.raw -match 'P\|1P\|1')        { throw 'records were fused together' }
          if (-not $got.source)                  { throw 'the connector did not report its source' }
          Write-Host "result delivered, source: $($got.source)"

      - name: A repeat transmission does not become a second result
        working-directory: connector
        shell: pwsh
        run: |
          .\test\start-mock.ps1
          node test/fake-analyzer.mjs 127.0.0.1 5150 260923000101 13.4
          Start-Sleep -Seconds 6
          $rec = Get-Content received.json -Raw | ConvertFrom-Json
          if ($rec.messages.Count -ne 1) {
            throw "expected 1 message after a duplicate, got $($rec.messages.Count)"
          }
          Write-Host 'duplicate correctly ignored'

      - name: --check reports a healthy install
        shell: pwsh
        run: |
          .\connector\test\start-mock.ps1
          & "$env:ProgramFiles\Uyirly\Connector\uyirly-connector.exe" --check
          if ($LASTEXITCODE -ne 0) { throw "--check reported a problem (exit $LASTEXITCODE)" }

      # Radiology runs through the same executable, so the same install must
      # answer scanners too. Without this the DICOM path is only ever exercised
      # on a Mac, which is how the postject and ESM-export failures got in.
      - name: A scanner can reach it, and the worklist comes back
        working-directory: connector
        shell: pwsh
        run: |
          .\test\start-mock.ps1

          # The firewall rule must exist, or a real machine cannot connect at
          # all and the failure is silent at both ends.
          $fw = (netsh advfirewall firewall show rule name="Uyirly Scanners (DICOM)" 2>$null) -join "`n"
          if ($LASTEXITCODE -ne 0)          { throw 'the scanner firewall rule was not created' }
          if ($fw -notmatch 'Enabled:\s*Yes') { throw 'the scanner firewall rule is switched off' }

          $listening = $false
          foreach ($i in 1..40) {
            if (Test-NetConnection -ComputerName 127.0.0.1 -Port 11112 -InformationLevel Quiet -WarningAction SilentlyContinue) {
              $listening = $true; break
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $listening) { throw 'nothing is listening on 11112 — scanners cannot connect' }

          # Speaks real DICOM: echo, worklist, then sends an image back.
          node test/fake-scanner.mjs 127.0.0.1 11112 CI_SCANNER 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { throw 'the fake scanner could not complete' }
          if (($out -join "`n") -notmatch 'echo\s*:\s*answered') { throw 'the connector did not answer a DICOM echo' }

          $text = $out -join "`n"
          if ($text -notmatch 'Test Patient|Patient\^Test') { throw 'the worklist did not reach the scanner' }
          if ($text -notmatch 'image sent')                  { throw 'the scanner could not send an image' }

          # The study closes on a thirty-second idle timer, then is reported.
          $got = $null
          foreach ($i in 1..24) {
            Start-Sleep -Seconds 2
            $rec = Get-Content received.json -Raw | ConvertFrom-Json
            if ($rec.studies.Count -ge 1) { $got = $rec.studies[0]; break }
          }
          if (-not $got)                          { throw 'the study was never reported to the server' }
          if ($got.accessionNumber -ne 'R2609260001') { throw "wrong accession came back: $($got.accessionNumber)" }
          if ($got.aeTitle -ne 'CI_SCANNER')      { throw "the machine was not identified: $($got.aeTitle)" }
          Write-Host "scanner verified — study $($got.accessionNumber) from $($got.aeTitle), $($got.instanceCount) image(s)"
          exit 0

      - name: The status page works, and only on this computer
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri 'http://localhost:5151' -UseBasicParsing -TimeoutSec 10).Content
          if ($page -notmatch 'Uyirly Lab Connector') { throw 'the status page did not render' }
          if ($page -notmatch 'Working')              { throw 'the page does not report a working connector' }
          if ($page -notmatch '5150')                 { throw 'the page does not show the engineer address' }

          # A desktop shortcut, or nobody will ever find it.
          $lnk = [System.IO.Path]::Combine([Environment]::GetFolderPath('CommonDesktopDirectory'), 'Uyirly Lab Connector.lnk')
          if (-not (Test-Path $lnk)) { throw 'the desktop shortcut was not created' }

          # It must not be reachable from the rest of the hospital network.
          $ip = (Get-NetIPAddress -AddressFamily IPv4 |
                 Where-Object { $_.IPAddress -notlike '127.*' } | Select-Object -First 1).IPAddress
          try {
            Invoke-WebRequest -Uri "http://${ip}:5151" -UseBasicParsing -TimeoutSec 5 | Out-Null
            throw "the status page answered on $ip — it must be loopback only"
          } catch [System.Net.WebException], [Microsoft.PowerShell.Commands.HttpResponseException] {
            Write-Host "correctly refused on $ip"
          } catch {
            if ($_.Exception.Message -like '*must be loopback only*') { throw }
            Write-Host "correctly unreachable on $ip"
          }
          Write-Host 'status page verified'
          exit 0

      - name: uninstall.ps1 removes what it made
        working-directory: connector/dist-exe
        shell: pwsh
        run: |
          .\uninstall.ps1
          schtasks /Query /TN 'UyirlyLabConnector' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'the startup task survived uninstall' }
          if (Test-Path "$env:ProgramFiles\Uyirly\Connector") { throw 'the program folder survived uninstall' }
          $lnk = [System.IO.Path]::Combine([Environment]::GetFolderPath('CommonDesktopDirectory'), 'Uyirly Lab Connector.lnk')
          if (Test-Path $lnk) { throw 'the desktop shortcut survived uninstall' }
          # Unsent results are deliberately kept — uninstall must not destroy
          # laboratory data that has not reached the server.
          if (-not (Test-Path "$env:ProgramData\Uyirly\Connector")) {
            throw 'the queue folder was deleted — unsent results must survive an uninstall'
          }
          Write-Host 'uninstall verified, queue preserved'
          # schtasks /Query above correctly fails once the task is gone, and the
          # Actions pwsh wrapper exits the step with the last native command's
          # code — so a step that succeeded would report failure without this.
          exit 0

      - name: Logs, if anything went wrong
        if: failure()
        shell: pwsh
        run: |
          Write-Host '--- connector log ---'
          Get-Content "$env:ProgramData\Uyirly\Connector\logs\connector.log" -Tail 60 -ErrorAction SilentlyContinue
          Write-Host '--- mock server ---'
          Get-Content connector\mock.log -Tail 30 -ErrorAction SilentlyContinue
          Get-Content connector\mock.err -Tail 30 -ErrorAction SilentlyContinue
          Write-Host '--- what the mock received ---'
          Get-Content connector\received.json -ErrorAction SilentlyContinue
